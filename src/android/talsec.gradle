ext {
    cdvCompileSdkVersion = 36
    cdvTargetSdkVersion = 36
}

repositories {
    maven { url "https://europe-west3-maven.pkg.dev/talsec-artifact-repository/freerasp" }
    maven { url "https://europe-west3-maven.pkg.dev/talsec-artifact-repository/common" }
}

dependencies {
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.4.1"
}

apply plugin: 'kotlinx-serialization'
apply plugin: 'app.talsec.plugin'

android {
    talsec {
        sdkVersion = "19.3.1"
        platform = "Cordova"
    }
    sourceSets {
        main.java {
            srcDirs += 'src/main/kotlin'
        }
    }
    if (project.android.hasProperty("namespace") && project.android.namespace == null) {
        namespace("com.aheaditec.talsec.cordova")
    }
}